<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffecd2);
      font-family: 'Georgia', serif;
    }

    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(255, 120, 150, 0.3);
      max-width: 380px;
      width: 90%;
    }

    h1 {
      margin-top: 16px;
      font-size: 22px;
      color: #c0406a;
      line-height: 1.4;
    }

    .input-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 30px 0 10px;
    }

    .digit-box {
      width: 54px;
      height: 64px;
      border: 2px solid #f7a8be;
      border-radius: 12px;
      font-size: 28px;
      text-align: center;
      color: #c0406a;
      background: #fff0f5;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .digit-box:focus {
      border-color: #c0406a;
      box-shadow: 0 0 0 3px rgba(192,64,106,0.15);
    }

    .digit-box.error {
      border-color: #e74c3c;
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .error-msg {
      color: #e74c3c;
      font-size: 14px;
      height: 20px;
      margin-bottom: 10px;
    }

    .tg-link {
      display: inline-block;
      margin-top: 8px;
      color: #c0406a;
      font-size: 18px;
      text-decoration: none;
      border-bottom: 2px solid #f7a8be;
      transition: color 0.2s, border-color 0.2s;
    }

    .tg-link:hover {
      color: #8e1a45;
      border-color: #c0406a;
    }

    .secret {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: linear-gradient(135deg, #fff0f5, #ffe0ec);
      border-radius: 16px;
      border: 1px solid #f7a8be;
    }

    .secret p {
      font-size: 20px;
      color: #c0406a;
      line-height: 1.6;
    }

    .secret .big {
      font-size: 36px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Света, введи наш пароль</h1>

    <div class="input-row">
      <input class="digit-box" id="d0" type="tel" maxlength="1" inputmode="numeric">
      <input class="digit-box" id="d1" type="tel" maxlength="1" inputmode="numeric">
      <input class="digit-box" id="d2" type="tel" maxlength="1" inputmode="numeric">
      <input class="digit-box" id="d3" type="tel" maxlength="1" inputmode="numeric">
    </div>

    <div class="error-msg" id="errMsg"></div>

    <div class="secret" id="secret">
      <a href="https://t.me/ilysfmtrustme" target="_blank" class="tg-link">Перейди сюда</a>
    </div>
  </div>

  <script>
    const inputs = document.querySelectorAll('.digit-box');
    const correct = ['3','1','0','7'];

    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g,'').slice(-1);
        if (inp.value && i < 3) inputs[i+1].focus();
        check();
      });

      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && i > 0) {
          inputs[i-1].focus();
        }
      });
    });

    function check() {
      const vals = [...inputs].map(i => i.value);
      if (vals.some(v => v === '')) return;

      if (vals.join('') === correct.join('')) {
        document.getElementById('secret').style.display = 'block';
        document.getElementById('errMsg').textContent = '';
        inputs.forEach(i => { i.classList.remove('error'); i.style.borderColor = '#2ecc71'; });
      } else {
        document.getElementById('secret').style.display = 'none';
        document.getElementById('errMsg').textContent = 'Неверный пароль, попробуй ещё раз';
        inputs.forEach(i => {
          i.classList.add('error');
          setTimeout(() => i.classList.remove('error'), 500);
        });
      }
    }

    inputs[0].focus();
  </script>
</body>
</html>
